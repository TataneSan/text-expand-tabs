[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-expand-tabs"
version = "1.0.0"
description = "Convert between tabs and spaces (expand/unexpand, tab size, check CI)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "TataneSan"}]
keywords = ["cli", "tool"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/TataneSan/text-expand-tabs"

[project.scripts]
text-expand-tabs = "text_expand_tabs.cli:main"

[tool.setuptools.packages.find]
include = ["text_expand_tabs*"]
