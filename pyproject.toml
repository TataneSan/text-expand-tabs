[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-expand-tabs"
version = "1.0.0"
description = "Expand tab characters into spaces with configurable tab stops"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "TataneSan"}]
keywords = ["text", "tabs", "expand", "cli"]

[project.scripts]
text-expand-tabs = "text_expand_tabs.cli:main"

[tool.setuptools]
packages = ["text_expand_tabs"]
